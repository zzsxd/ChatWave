services:
  chatwave:
    image: ghcr.io/lifufkd/chatwave:latest
    build: .
    restart: unless-stopped
    ports:
      - ${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000
    volumes:
      - app_data:${MEDIA_FOLDER:-/app/data}
    env_file:
      - "${ENV_FILE:-.env}"
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_DATABASE=${DB_DATABASE:-postgres}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - API_CORS_ALLOW_ORIGINS=${API_CORS_ALLOW_ORIGINS:?API_CORS_ALLOW_ORIGINS is required}
      - MODE=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    cpus: ${APP_CPU_LIMIT:-1.0}
    networks:
      - backend

  web:
    image: ghcr.io/lifufkd/chatwave-web:latest
    restart: unless-stopped
    ports:
      - ${HTTP_WEB_PORT:-80}:80
      - ${HTTPS_WEB_PORT:-443}:443
    env_file:
      - "${ENV_FILE:-.env}"
    depends_on:
      - chatwave
    networks:
      - backend

  frontend:
    image: chatwave-frontend:local
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_CHATWAVE_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-8091}:3000
    environment:
      - NEXT_PUBLIC_CHATWAVE_API_URL=${FRONTEND_API_URL:-http://localhost:8000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      chatwave:
        condition: service_healthy
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-384m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    networks:
      - backend

  turn:
    image: coturn/coturn:4.14.0-r0
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      - --realm=${TURN_REALM:-chatwave.local}
      - --server-name=${TURN_REALM:-chatwave.local}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      - --no-multicast-peers
      - --no-tls
      - --no-dtls
    mem_limit: ${TURN_MEMORY_LIMIT:-128m}
    cpus: ${TURN_CPU_LIMIT:-0.25}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "turnutils_stunclient 127.0.0.1 -p 3478 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
       - POSTGRES_USER=${DB_USER:?DB_USER is required}
       - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
       - POSTGRES_DB=${DB_DATABASE:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}

volumes:
  postgres_data:
  redis_data:
  app_data:

networks:
  backend:
