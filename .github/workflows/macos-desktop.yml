name: macOS Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build macOS application
        run: npm run build:mac -- --${{ matrix.arch }}

      - name: Prepare architecture update channel
        run: mv release/latest-mac.yml release/latest-${{ matrix.arch }}-mac.yml

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: ChatWave-macOS-${{ matrix.arch }}
          path: |
            desktop/release/ChatWave-*-${{ matrix.arch }}.dmg
            desktop/release/ChatWave-*-${{ matrix.arch }}.zip
            desktop/release/latest-${{ matrix.arch }}-mac.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ChatWave-macOS-*
          path: release-assets
          merge-multiple: true
      - name: Publish macOS update assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
