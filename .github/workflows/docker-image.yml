name: Publish Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Security and test checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chatwave
          POSTGRES_PASSWORD: ci-database-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatwave -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MODE: testing
      TEST_DB_USER: chatwave
      TEST_DB_PASSWORD: ci-database-password
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_DATABASE: postgres
      DB_SCHEMA: chatwave
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MEDIA_FOLDER: /tmp/chatwave-test-media
      JWT_SECRET_KEY: ci-only-secret-that-is-long-enough-for-security-validation-123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: ruff check src tests --ignore F401,F821

      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Verify clean database migrations
        env:
          DB_USER: chatwave
          DB_PASSWORD: ci-database-password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres
        run: alembic upgrade head

  build:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build and push Docker image with version
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/chatwave
          VERSION=${{ steps.version.outputs.VERSION }}

          docker buildx build --platform linux/amd64,linux/arm64 \
            -t $IMAGE:latest \
            -t $IMAGE:$VERSION \
            --push .

      - name: Build pull request image
        if: github.event_name == 'pull_request'
        run: docker buildx build --platform linux/amd64 --load .
