// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// External macOS volumes can create AppleDouble `._*` metadata files inside
// generated resources. Android's resource parser treats those files as broken
// resource directories, so CI/local builds may redirect only generated output
// to a native filesystem through CHATWAVE_ANDROID_BUILD_DIR.
def redirectedBuildDir = System.getenv("CHATWAVE_ANDROID_BUILD_DIR")
if (redirectedBuildDir) {
    rootProject.layout.buildDirectory.set(file(redirectedBuildDir))
    subprojects {
        layout.buildDirectory.set(file("${redirectedBuildDir}/${name}"))
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
