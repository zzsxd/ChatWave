<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080d17" />
    <title>ChatWave</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
        background: #080d17;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, #173869 0, transparent 31%),
          #080d17;
      }

      body {
        display: grid;
        place-items: center;
        color: #f7f9ff;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 20px;
        padding:
          max(28px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(28px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        text-align: center;
      }

      img {
        width: 104px;
        height: 104px;
        border-radius: 26px;
        box-shadow: 0 18px 50px rgb(26 103 255 / 32%);
      }

      h1 {
        margin: 0;
        font-size: 29px;
        letter-spacing: -0.7px;
      }

      p {
        max-width: 310px;
        margin: -10px 0 0;
        color: #97a5bc;
        font-size: 15px;
        line-height: 1.45;
      }

      .connection-state {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 24px;
        color: #71dbff;
        font-size: 13px;
      }

      button {
        min-height: 46px;
        padding: 0 22px;
        border: 1px solid rgb(111 155 255 / 35%);
        border-radius: 15px;
        color: white;
        background: linear-gradient(135deg, #286cff, #7658f6);
        font: inherit;
        font-weight: 650;
        box-shadow: 0 12px 28px rgb(48 102 255 / 25%);
      }

      .loader {
        width: 24px;
        height: 24px;
        border: 2px solid rgb(255 255 255 / 18%);
        border-top-color: #71dbff;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon.png" alt="" />
      <h1>ChatWave</h1>
      <p id="status">
        Не удалось подключиться. Проверьте интернет и попробуйте снова.
      </p>
      <div class="connection-state" id="connection-state" hidden>
        <span class="loader" aria-hidden="true"></span>
        <span id="attempt-label">Подключаемся…</span>
      </div>
      <button id="retry" type="button">Повторить</button>
    </main>
    <script>
      const target = "https://app.chatwave.62-113-44-238.sslip.io/";
      const status = document.querySelector("#status");
      const retry = document.querySelector("#retry");
      const connectionState = document.querySelector("#connection-state");
      const attemptLabel = document.querySelector("#attempt-label");
      const retryDelays = [1500, 3000, 5000, 8000, 13000, 21000, 30000];
      let retryNumber = 0;
      let retryTimer = 0;
      let navigating = false;

      const navigateToChatWave = () => {
        if (navigating || !navigator.onLine) return;
        navigating = true;
        retry.hidden = true;
        connectionState.hidden = false;
        status.textContent = "Соединение восстановлено. Открываем ChatWave…";
        attemptLabel.textContent = "Подключаемся…";

        const url = new URL(target);
        url.searchParams.set("mobile-reconnect", Date.now().toString());
        window.location.replace(url.toString());
      };

      const scheduleRetry = (immediate = false) => {
        window.clearTimeout(retryTimer);

        if (!navigator.onLine) {
          navigating = false;
          connectionState.hidden = true;
          retry.hidden = false;
          status.textContent =
            "Нет подключения к интернету. ChatWave откроется автоматически, когда сеть появится.";
          return;
        }

        const delay = immediate
          ? 0
          : retryDelays[Math.min(retryNumber, retryDelays.length - 1)];
        retryNumber += 1;
        connectionState.hidden = false;
        retry.hidden = true;
        status.textContent =
          "Сервер временно недоступен. Повторяем подключение автоматически.";
        attemptLabel.textContent =
          delay > 0
            ? `Следующая попытка через ${Math.ceil(delay / 1000)} сек.`
            : "Подключаемся…";
        retryTimer = window.setTimeout(navigateToChatWave, delay);
      };

      retry.addEventListener("click", () => {
        navigating = false;
        scheduleRetry(true);
      });

      window.addEventListener("online", () => {
        navigating = false;
        retryNumber = 0;
        scheduleRetry(true);
      });

      window.addEventListener("offline", () => scheduleRetry());
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          navigating = false;
          scheduleRetry(true);
        }
      });

      scheduleRetry();
    </script>
  </body>
</html>
